# Build Android version of the app

name: Android

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_exists: ${{ steps.check_tag.outputs.exists }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout Actions Repo
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(curl -s https://api.github.com/repos/inventree/inventree-app/releases/latest | grep '"tag_name":' | cut -d'"' -f4)
          fi
          echo "tag_name=$VERSION" >> $GITHUB_OUTPUT

      - name: Check Tag Exists
        id: check_tag
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false'
    runs-on: macos-latest
  
    permissions:
      contents: write

    steps:
      - name: Checkout inventree-app
        uses: actions/checkout@v7
        with:
          repository: 'inventree/inventree-app'  # 目标源码仓库
          ref: ${{ needs.prepare.outputs.tag_name }}
          path: '.'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup FVM
        id: fvm-config-action
        uses: kuhnroyal/flutter-fvm-config-action@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
          cache: false
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - run: flutter --version

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2.4.2
        with:
          gradle-version: 8.11.1

      - name: Collect Translation Files
        run: |
          cd lib/l10n
          python3 collect_translations.py

      - name: Setup Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          
          echo "storeFile=android/app/upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Build for Android
        run: |
          dart pub global activate fvm
          fvm install
          fvm flutter pub get
          # fvm flutter build apk --debug
          # cp build/app/outputs/flutter-apk/app-debug.apk build/inventree-app-${{ needs.prepare.outputs.tag_name }}-debug.apk
          fvm flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/inventree-app-${{ needs.prepare.outputs.tag_name }}-release.apk
      
      - name: Create Tag and Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: "${{ needs.prepare.outputs.tag_name }}"
          body: ${{ needs.prepare.outputs.tag_name }}
          files: |
            # build/inventree-app-${{ needs.prepare.outputs.tag_name }}-debug.apk
            build/inventree-app-${{ needs.prepare.outputs.tag_name }}-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
